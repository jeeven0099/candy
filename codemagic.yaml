workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jeeven.candy
      vars:
        APP_STORE_CONNECT_ISSUER_ID: Encrypted(...)
        APP_STORE_CONNECT_KEY_IDENTIFIER: Encrypted(...)
        APP_STORE_CONNECT_PRIVATE_KEY: Encrypted(...)
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Create distribution certificate
        script: |
          app-store-connect create-certificate \
            --type IOS_DISTRIBUTION \
            --save || true
          app-store-connect list-certificates \
            --type IOS_DISTRIBUTION \
            --save

      - name: Fetch provisioning profile
        script: |
          app-store-connect fetch-signing-files com.jeeven.candy \
            --type IOS_APP_STORE \
            --create \
            --save

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Flutter pub get
        script: |
          cd promo_viewer
          flutter pub get

      - name: Build iOS IPA
        script: |
          cd promo_viewer
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - promo_viewer/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
