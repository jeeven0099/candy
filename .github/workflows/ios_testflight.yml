name: iOS Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'altstore-source.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set build version
        id: meta
        run: |
          VERSION=$(date -u +"%Y.%m.%d.%H%M")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Stamp version into pubspec.yaml
        run: |
          sed -i '' "s/^version: .*/version: ${{ steps.meta.outputs.version }}+1/" promo_viewer/pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: cd promo_viewer && flutter pub get

      - name: Build iOS app (unsigned)
        run: |
          cd promo_viewer
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p promo_viewer/build/ios/ipa/Payload
          cp -r promo_viewer/build/ios/Release-iphoneos/Runner.app \
                promo_viewer/build/ios/ipa/Payload/
          cd promo_viewer/build/ios/ipa
          zip -r candy.ipa Payload/

      - name: Get IPA size
        id: size
        run: |
          SIZE=$(wc -c < promo_viewer/build/ios/ipa/candy.ipa | tr -d ' ')
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Candy ${{ steps.meta.outputs.version }}
          files: promo_viewer/build/ios/ipa/candy.ipa

      - name: Update AltStore source JSON
        run: |
          python3 - <<'PYEOF'
          import json, os

          version  = os.environ['VERSION']
          date     = os.environ['DATE']
          size     = int(os.environ['SIZE'])
          repo     = os.environ['GITHUB_REPOSITORY']

          source = {
            "name": "Candy",
            "identifier": "com.jeeven.candy.altsource",
            "apps": [
              {
                "name": "Candy",
                "bundleIdentifier": "com.promoviewer.promoViewer",
                "developerName": "Jeeven",
                "localizedDescription": "Find the best deals near you and online.",
                "iconURL": f"https://raw.githubusercontent.com/{repo}/master/promo_viewer/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png",
                "versions": [
                  {
                    "version": version,
                    "date": date,
                    "localizedDescription": "Latest build",
                    "downloadURL": f"https://github.com/{repo}/releases/download/v{version}/candy.ipa",
                    "size": size
                  }
                ]
              }
            ],
            "news": []
          }

          with open('altstore-source.json', 'w') as f:
              json.dump(source, f, indent=2)

          print(f"Updated: version={version} size={size}")
          PYEOF
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DATE:    ${{ steps.meta.outputs.date }}
          SIZE:    ${{ steps.size.outputs.size }}

      - name: Commit AltStore source
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json
          git commit -m "Update AltStore source to v${{ steps.meta.outputs.version }} [skip ci]"
          git push
