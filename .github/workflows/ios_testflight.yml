name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: cd promo_viewer && flutter pub get

      - name: Build iOS app (unsigned)
        run: |
          cd promo_viewer
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p promo_viewer/build/ios/ipa/Payload
          cp -r promo_viewer/build/ios/Release-iphoneos/Runner.app \
                promo_viewer/build/ios/ipa/Payload/
          cd promo_viewer/build/ios/ipa
          zip -r candy.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: candy-ios
          path: promo_viewer/build/ios/ipa/candy.ipa
          retention-days: 7
