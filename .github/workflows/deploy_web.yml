name: Deploy Web

on:
  push:
    branches: [master]
    paths:
      - 'promo_viewer/**'
      - '.github/workflows/deploy_web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: cd promo_viewer && flutter pub get

      - name: Build web
        run: cd promo_viewer && flutter build web --release --base-href /candy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: promo_viewer/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
